name: Sync official Harness

on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  propose-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and merge the latest official source
        id: merge
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote add official https://github.com/deepseek-ai/deepseek-harness.git || true
          git fetch official master
          git checkout -B automation/upstream-sync origin/master
          upstream_sha="$(git rev-parse official/master)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor official/master origin/master; then
            echo 'state=up-to-date' >> "$GITHUB_OUTPUT"
            echo 'DSH Desktop already contains the latest official source.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git merge --no-edit official/master; then
            echo 'state=merged' >> "$GITHUB_OUTPUT"
            echo "Official Harness $upstream_sha merged cleanly into the update branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          conflict_count="$(git diff --name-only --diff-filter=U | sed '/^$/d' | wc -l | tr -d ' ')"
          {
            echo 'state=conflict'
            echo "conflict_count=$conflict_count"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Official update needs manual integration'
            echo
            echo "Upstream commit: \`$upstream_sha\`"
            echo "Conflicting files: $conflict_count"
            echo
            echo 'The installer build was not started with unresolved source. See the tracking issue for details.'
          } >> "$GITHUB_STEP_SUMMARY"
          git merge --abort
          echo "::warning::Official Harness $upstream_sha has $conflict_count merge conflicts; a tracking issue will be updated."

      - name: Push update branch and open a pull request
        if: steps.merge.outputs.state == 'merged'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force-with-lease origin automation/upstream-sync
          existing="$(gh pr list --head automation/upstream-sync --base master --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base master \
              --head automation/upstream-sync \
              --title 'sync: merge latest official Harness' \
              --body 'Automated upstream merge. Installer workflows must pass before this pull request is merged.'
          fi

      - name: Record a merge conflict without failing the daily check
        if: steps.merge.outputs.state == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          CONFLICT_COUNT: ${{ steps.merge.outputs.conflict_count }}
        run: |
          title='sync: official Harness update needs manual integration'
          body="Official Harness commit \`$UPSTREAM_SHA\` cannot be merged automatically into \`master\`.

          Conflicting files: $CONFLICT_COUNT

          This issue is maintained by the scheduled upstream check. Resolve the official changes on a dedicated branch, test the desktop application, and merge through a pull request. Installer builds continue to use the last verified \`master\` commit."
          existing="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a stale conflict notice
        if: steps.merge.outputs.state != 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='sync: official Harness update needs manual integration'
          existing="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment 'The latest official Harness source now merges cleanly or is already included.'
          fi
