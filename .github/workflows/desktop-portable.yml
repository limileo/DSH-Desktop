name: Desktop installers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop-portable.yml'
      - 'apps/**'
      - 'packages/**'
      - 'vendor/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: desktop-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the latest official source
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git remote add official https://github.com/deepseek-ai/deepseek-harness.git || true
          git fetch official master
          git -c user.name=github-actions -c user.email=github-actions@github.com merge --no-edit official/master

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build desktop installer
        shell: bash
        run: pnpm run dist:desktop:unsigned

      - name: Verify macOS installer exists
        if: runner.os == 'macOS'
        shell: bash
        run: test -n "$(find apps/desktop/dist -maxdepth 1 -type f -name 'DSH-Desktop-macOS-*.dmg' -print -quit)"

      - name: Verify Windows installer exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-ChildItem 'apps/desktop/dist/DSH-Desktop-Windows-*-Setup-*.exe')) { throw 'Windows installer missing' }

      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/smoke-windows-installer.ps1 -Installer (Get-ChildItem 'apps/desktop/dist/DSH-Desktop-Windows-*-Setup-*.exe' | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/dist/DSH-Desktop-*.dmg
            apps/desktop/dist/DSH-Desktop-*.exe
          if-no-files-found: error
          retention-days: 30
